<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Audio Durations</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="header">
  <div class="container">
    <h1>Audio <span>Durations</span></h1>
    <nav>
      <a href="/" style="color:var(--text-muted);text-decoration:none;font-size:.85rem;">Back to tool</a>
    </nav>
  </div>
</header>

<main class="container" style="padding-top:32px;">

  <div class="card">
    <h2>Contact</h2>
    <p style="color:var(--text-muted);font-size:.9rem;line-height:1.7;margin-bottom:20px;">
      Have a question, bug report, or feature request? Reach out below.
    </p>

    <form id="contact-form" style="max-width:500px;">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" style="width:100%;" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" style="width:100%;" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" style="width:100%;" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Send</button>
    </form>

    <p id="contact-status" style="margin-top:12px;color:var(--text-muted);font-size:.9rem;"></p>
  </div>

</main>

<footer class="footer">
  <p>Audio Durations</p>
  <p style="margin-top:6px;">
    <a href="/privacy" style="color:var(--text-muted);text-decoration:none;">Privacy Policy</a>
    &nbsp;&middot;&nbsp;
    <a href="/contact" style="color:var(--text-muted);text-decoration:none;">Contact</a>
  </p>
</footer>

<script>
document.getElementById("contact-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  const status = document.getElementById("contact-status");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Sending...';
  status.textContent = "";

  try {
    const fd = new FormData(e.target);
    const res = await fetch("/contact", { method: "POST", body: fd });
    const data = await res.json();
    if (res.ok) {
      status.textContent = "Message sent. We'll get back to you soon.";
      status.style.color = "var(--success)";
      e.target.reset();
    } else {
      status.textContent = data.error || "Failed to send.";
      status.style.color = "var(--danger)";
    }
  } catch (err) {
    status.textContent = "Network error. Try again.";
    status.style.color = "var(--danger)";
  } finally {
    btn.disabled = false;
    btn.innerHTML = "Send";
  }
});
</script>

</body>
</html>
